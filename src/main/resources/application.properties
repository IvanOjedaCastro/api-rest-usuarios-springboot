spring.application.name=prueba
# Habilitar la consola de H2 en el navegador
spring.h2.console.enabled=true
spring.h2.console.ui-process.path=/h2-console

# Forzar URL fija en memoria (evita nombres aleatorios)
spring.datasource.url=jdbc:h2:mem:pruebadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true